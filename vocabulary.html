<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A2 English vocabulary with Persian meanings and useful examples.">
  <title>Vocabulary | Arash English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-main">
    <section class="page-hero">
      <div class="container narrow">
        <span class="eyebrow">VOCABULARY • A2</span>
        <h1>Words you can actually use.</h1>
        <p>Learn practical A2 vocabulary in context. Each word has a Persian meaning and a natural example sentence.</p>
      </div>
    </section>
    <section class="section section-tight">
      <div class="container">
        <div class="toolbar">
          <div class="search-wrap"><span>⌕</span><input id="vocabSearch" type="search" placeholder="Search a word or Persian meaning..."></div>
          <select id="topicFilter" class="select-control"><option value="all">All topics</option></select>
        </div>
        <div id="vocabGrid" class="vocab-grid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
