<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A1 and A2 English grammar lessons with Persian translations and examples.">
  <title>Grammar | Arash English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page-main">
    <section class="page-hero">
      <div class="container narrow">
        <span class="eyebrow">GRAMMAR LAB • A1 + A2</span>
        <h1>Grammar, explained simply.</h1>
        <p>Start with A1 foundations and move through A2 structures. Every lesson includes English examples and Persian translations.</p>
      </div>
    </section>

    <section class="section section-tight">
      <div class="container">
        <div class="toolbar">
          <div class="search-wrap"><span>⌕</span><input id="grammarSearch" type="search" placeholder="Search grammar, e.g. present perfect..."></div>
          <div class="filter-tabs" id="levelFilters">
            <button class="filter-btn active" data-level="all">All</button>
            <button class="filter-btn" data-level="A1">A1</button>
            <button class="filter-btn" data-level="A2">A2</button>
          </div>
        </div>
        <div id="grammarList" class="lesson-grid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="script.js"></script>
</body>
</html>
